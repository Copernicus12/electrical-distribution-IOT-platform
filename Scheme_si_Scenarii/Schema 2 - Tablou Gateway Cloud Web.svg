<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="Legătura dintre senzori, gateway, cloud și pagina web"><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#326da8" stroke-width="1.7"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#b77335" stroke-width="1.7"/></marker><marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#8160a4" stroke-width="1.7"/></marker></defs><rect width="1440" height="1120" fill="#ffffff"/><g font-family="Arial,Helvetica,sans-serif"><path d="M231 103 H469" fill="none" stroke="#326da8" stroke-width="2" marker-end="url(#blue)"/><text x="350" y="88" font-size="15" fill="#326da8" text-anchor="middle" font-weight="400">Măsurători</text><path d="M469 139 H231" fill="none" stroke="#b77335" stroke-width="2" marker-end="url(#orange)"/><text x="350" y="165" font-size="15" fill="#b77335" text-anchor="middle" font-weight="400">Comenzi</text><path d="M601 103 H839" fill="none" stroke="#326da8" stroke-width="2" marker-end="url(#blue)"/><text x="720" y="88" font-size="15" fill="#326da8" text-anchor="middle" font-weight="400">Date utile</text><path d="M839 139 H601" fill="none" stroke="#b77335" stroke-width="2" marker-end="url(#orange)"/><text x="720" y="165" font-size="15" fill="#b77335" text-anchor="middle" font-weight="400">Comenzi</text><path d="M971 103 H1209" fill="none" stroke="#326da8" stroke-width="2" marker-end="url(#blue)"/><text x="1090" y="88" font-size="15" fill="#326da8" text-anchor="middle" font-weight="400">Date salvate</text><path d="M1209 139 H971" fill="none" stroke="#b77335" stroke-width="2" marker-end="url(#orange)"/><text x="1090" y="165" font-size="15" fill="#b77335" text-anchor="middle" font-weight="400">Cereri</text><circle cx="165" cy="120" r="59" fill="#326da8" fill-opacity=".07"/><circle cx="165" cy="120" r="49" fill="white" stroke="#326da8" stroke-width="1.5"/><g transform="translate(165 120)" fill="none" stroke="#326da8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-21 -25 H21 V25 H-21z M-12 -12 H12 M-12 0 H0 M-12 12 H12"/><circle cx="10" cy="0" r="3"/></g><text x="165" y="218" font-size="23" fill="#253443" text-anchor="middle" font-weight="600">Tablou și senzori</text><text x="165" y="245" font-size="17" fill="#657281" text-anchor="middle" font-weight="400">Măsoară și răspund</text><circle cx="535" cy="120" r="59" fill="#287e6a" fill-opacity=".07"/><circle cx="535" cy="120" r="49" fill="white" stroke="#287e6a" stroke-width="1.5"/><g transform="translate(535 120)" fill="none" stroke="#287e6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-26" y="-18" width="52" height="36" rx="8"/><path d="M-17 8 h6 M-5 8 h6 M0 -18 v-10 M-8 -28 h16"/><circle cx="16" cy="-5" r="3"/></g><text x="535" y="218" font-size="23" fill="#253443" text-anchor="middle" font-weight="600">Gateway</text><text x="535" y="245" font-size="17" fill="#657281" text-anchor="middle" font-weight="400">Verifică și decide</text><circle cx="905" cy="120" r="59" fill="#8160a4" fill-opacity=".07"/><circle cx="905" cy="120" r="49" fill="white" stroke="#8160a4" stroke-width="1.5"/><g transform="translate(905 120)" fill="none" stroke="#8160a4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-21 15 C-40 12 -34 -12 -18 -10 C-15 -34 18 -34 22 -10 C43 -9 40 15 22 15z"/></g><text x="905" y="218" font-size="23" fill="#253443" text-anchor="middle" font-weight="600">Cloud</text><text x="905" y="245" font-size="17" fill="#657281" text-anchor="middle" font-weight="400">Salvează în baza de date</text><circle cx="1275" cy="120" r="59" fill="#b77335" fill-opacity=".07"/><circle cx="1275" cy="120" r="49" fill="white" stroke="#b77335" stroke-width="1.5"/><g transform="translate(1275 120)" fill="none" stroke="#b77335" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-22" width="56" height="44" rx="5"/><path d="M-28 -9 h56 M-19 -16 h2 M-12 -16 h2 M-5 -16 h2 M-17 2 h16 M-17 11 h28"/></g><text x="1275" y="218" font-size="23" fill="#253443" text-anchor="middle" font-weight="600">Pagina web</text><text x="1275" y="245" font-size="17" fill="#657281" text-anchor="middle" font-weight="400">Vezi și dai comenzi</text><path d="M60 292 H1380" stroke="#e6e9ed" stroke-width="1"/><text x="60" y="339" font-size="22" fill="#253443" text-anchor="start" font-weight="500">Exemplu: un senzor arată o temperatură prea mare</text><circle cx="78" cy="388" r="18" fill="#b77335" fill-opacity=".10"/><text x="78" y="394" font-size="17" fill="#b77335" text-anchor="middle" font-weight="600">1</text><text x="60" y="444" font-size="21" fill="#253443" text-anchor="start" font-weight="600">Ceri verificarea din web</text><text x="60" y="475" font-size="17" fill="#526171" text-anchor="start" font-weight="400">„Verifică senzorul din T02.”</text><text x="60" y="501" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Cererea ajunge la gateway.</text><path d="M112 388 H524" fill="none" stroke="#8160a4" stroke-width="2" marker-end="url(#purple)"/><circle cx="558" cy="388" r="18" fill="#287e6a" fill-opacity=".10"/><text x="558" y="394" font-size="17" fill="#287e6a" text-anchor="middle" font-weight="600">2</text><text x="540" y="444" font-size="21" fill="#253443" text-anchor="start" font-weight="600">Sistemul face un test</text><text x="540" y="475" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Compară doi senzori din tablouri diferite:</text><text x="540" y="501" font-size="17" fill="#526171" text-anchor="start" font-weight="400">unul din T02 și unul din T03.</text><path d="M592 388 H1004" fill="none" stroke="#8160a4" stroke-width="2" marker-end="url(#purple)"/><circle cx="1038" cy="388" r="18" fill="#8160a4" fill-opacity=".10"/><text x="1038" y="394" font-size="17" fill="#8160a4" text-anchor="middle" font-weight="600">3</text><text x="1020" y="444" font-size="21" fill="#253443" text-anchor="start" font-weight="600">Vezi rezultatul</text><text x="1020" y="475" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Ce s-a schimbat după test?</text><text x="1020" y="501" font-size="17" fill="#526171" text-anchor="start" font-weight="400">E senzorul sau conexiunea?</text><path d="M60 548 H1380" stroke="#e6e9ed"/><path d="M60 590 v200" stroke="#b77335" stroke-width="3" stroke-linecap="round"/><text x="83" y="609" font-size="20" fill="#253443" text-anchor="start" font-weight="600">Dacă senzorul este defect</text><text x="83" y="683" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Cere o verificare și folosește datele credibile.</text><text x="83" y="710" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Încearcă repornirea, dacă senzorul permite.</text><text x="83" y="737" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Dacă nu își revine, cere înlocuirea.</text><path d="M755 590 v200" stroke="#287e6a" stroke-width="3" stroke-linecap="round"/><text x="778" y="609" font-size="20" fill="#253443" text-anchor="start" font-weight="600">Dacă se încălzește prea tare un contact electric</text><text x="778" y="636" font-size="20" fill="#253443" text-anchor="start" font-weight="600">dintr-un contactor sau piesa acționată mecanic</text><text x="778" y="683" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Mută alimentarea pe alt traseu, dacă se poate.</text><text x="778" y="710" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Verifică dacă temperatura începe să scadă.</text><text x="778" y="737" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Dacă este nevoie, reduce consumul.</text><path d="M60 855 v200" stroke="#b95353" stroke-width="3" stroke-linecap="round"/><text x="83" y="874" font-size="20" fill="#253443" text-anchor="start" font-weight="600">Dacă o piesă este complet stricată</text><text x="83" y="948" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Izolează partea defectă și confirmă oprirea.</text><text x="83" y="975" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Caută alt tablou pentru alimentarea consumatorilor</text><text x="83" y="1002" font-size="17" fill="#526171" text-anchor="start" font-weight="400">sau împarte sarcina între tablouri, dacă pot prelua.</text><text x="83" y="1029" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Împarte sarcina în funcție de cât poate prelua fiecare.</text><path d="M755 855 v200" stroke="#326da8" stroke-width="3" stroke-linecap="round"/><text x="778" y="874" font-size="20" fill="#253443" text-anchor="start" font-weight="600">Dacă se pierde legătura cu senzorii</text><text x="778" y="948" font-size="17" fill="#526171" text-anchor="start" font-weight="400">În web se observă întârzieri între datele primite de la senzori.</text><text x="778" y="975" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Comută pe alt protocol disponibil: MQTT, HTTPS sau WSS.</text><text x="778" y="1002" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Verifică dacă sosesc din nou date de la tablou.</text><text x="778" y="1029" font-size="17" fill="#526171" text-anchor="start" font-weight="400">Dacă niciun protocol nu merge, păstrează datele local.</text></g></svg>
